name: Run CreatorBoost content automation
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-content-worker:
    runs-on: ubuntu-latest
    env:
      WORKER_SECRET: ${{ secrets.CONTENT_WORKER_SECRET }}
    steps:
      - name: Invoke scheduled content worker
        if: env.WORKER_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://yubjmudsbbgskeqqejob.supabase.co/functions/v1/content-worker" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
      - name: Skip until worker secret is configured
        if: env.WORKER_SECRET == ''
        run: echo "Skipped: add CONTENT_WORKER_SECRET to GitHub Actions secrets to activate 24/7 scheduling."
