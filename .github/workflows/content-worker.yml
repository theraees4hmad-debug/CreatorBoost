name: Run CreatorBoost content automation
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-content-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke scheduled content worker
        env:
          WORKER_SECRET: ${{ secrets.CONTENT_WORKER_SECRET }}
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "Skipped: add CONTENT_WORKER_SECRET to GitHub Actions secrets to activate 24/7 scheduling."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://yubjmudsbbgskeqqejob.supabase.co/functions/v1/content-worker" \
            -H "x-worker-secret: $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'
