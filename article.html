const db=window.supabase.createClient("https://yubjmudsbbgskeqqejob.supabase.co","sb_publishable_Bb3ky6zyibP7LS2dXVZNnA_UYNWezlr");const slug=new URLSearchParams(location.search).get("slug");const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const root=document.getElementById("story");if(!slug){root.textContent="Story not found.";return}const {data,error}=await db.from("cb_public_articles").select("*").eq("slug",slug).eq("status","published").maybeSingle();if(error||!data){root.textContent="This story is not available.";return}document.title=data.title+" — CreatorBoost";

const canonical=location.origin+location.pathname+"?slug="+encodeURIComponent(data.slug);
const setMeta=(selector,value)=>{let el=document.querySelector(selector);if(!el){el=document.createElement("meta");const prop=selector.includes("property=");el.setAttribute(prop?"property":"name",selector.match(/"([^"]+)"/)[1]);document.head.appendChild(el);}el.setAttribute("content",value);};

const schema={"@context":"https://schema.org","@type":"NewsArticle","headline":data.title,"description":description,"datePublished":data.published_at,"dateModified":data.published_at,"author":{"@type":"Organization","name":"CreatorBoost Editorial"},"publisher":{"@type":"Organization","name":"CreatorBoost"},"mainEntityOfPage":canonical,"image":data.image_url?[data.image_url]:undefined,"citation":data.source_url};
const ld=document.createElement("script");ld.type="application/ld+json";ld.textContent=JSON.stringify(schema);document.head.appendChild(ld);
const shareUrl=encodeURIComponent(canonical),shareTitle=encodeURIComponent(data.title);
root.innerHTML='<a class="back" href="news.html">← All stories</a><div class="tag">'+esc(data.category)+'</div><h1>'+esc(data.title)+'</h1><div class="meta">By CreatorBoost Editorial · '+new Date(data.published_at).toLocaleString()+'</div>'+(data.image_url?'<img class="story-image" src="'+esc(data.image_url)+'" alt="'+esc(data.title)+'" loading="eager" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true">':'')+'<div class="body">'+(window.marked?DOMPurify.sanitize(marked.parse(data.body)):'<p>'+esc(data.body)+'</p>')+'</div><div class="share"><button type="button" id="nativeShare">Share story</button><a target="_blank" rel="noopener noreferrer" href="https://wa.me/?text='+shareTitle+'%20'+shareUrl+'">WhatsApp</a><a target="_blank" rel="noopener noreferrer" href="https://twitter.com/intent/tweet?text='+shareTitle+'&url='+shareUrl+'">Post on X</a><button type="button" id="copyStory">Copy link</button></div><div class="source">Original source: <a href="'+esc(data.source_url)+'" target="_blank" rel="noopener noreferrer">'+esc(data.source_name)+'</a>. Read the source for the full report and context.</div>';
const native=document.getElementById("nativeShare"),copy=document.getElementById("copyStory");
native?.addEventListener("click",async()=>{if(navigator.share){try{await navigator.share({title:data.title,text:description,url:canonical});}catch(e){}}else{try{await navigator.clipboard.writeText(canonical);native.textContent="Link copied";}catch{native.textContent="Copy unavailable";}}});
copy?.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(canonical);copy.textContent="Copied";}catch{copy.textContent="Copy unavailable";}});
})();
