<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d19"><title>CreatorBoost — Story</title><style>
:root{color-scheme:dark;--bg:#080d19;--muted:#a2b1c8;--cyan:#53ded4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#222957,transparent 38%),var(--bg);color:#f3f6ff;font:16px/1.8 system-ui,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:0 22px}header{padding:22px 0;border-bottom:1px solid #ffffff18}a{color:var(--cyan)}.brand{color:white;text-decoration:none;font-weight:850}.story{padding:42px 0}.story-image{display:block;width:100%;max-height:480px;aspect-ratio:16/9;object-fit:cover;border-radius:18px;margin:22px 0 28px;background:#101a2b}.tag{color:var(--cyan);font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:1px}.story h1{font-size:clamp(34px,6vw,54px);line-height:1.12;letter-spacing:-1.5px}.meta{color:var(--muted);font-size:13px}.body{white-space:normal}.body h2{margin-top:30px}.body p{color:#d7e0ef}.source{padding:17px;background:#101a2b;border:1px solid #263750;border-radius:13px;color:var(--muted);font-size:13px}.back{display:inline-block;margin-bottom:22px}@media(max-width:560px){.wrap{padding:0 15px}.story{padding-top:30px}}

const db=window.supabase.createClient("https://yubjmudsbbgskeqqejob.supabase.co","sb_publishable_Bb3ky6zyibP7LS2dXVZNnA_UYNWezlr");const slug=new URLSearchParams(location.search).get("slug");const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const root=document.getElementById("story");if(!slug){root.textContent="Story not found.";return}const {data,error}=await db.from("cb_public_articles").select("*").eq("slug",slug).eq("status","published").maybeSingle();if(error||!data){root.textContent="This story is not available.";return}document.title=data.title+" — CreatorBoost";root.innerHTML='<a class="back" href="news.html">← All stories</a><div class="tag">'+esc(data.category)+'</div><h1>'+esc(data.title)+'</h1><div class="meta">By CreatorBoost Editorial · '+new Date(data.published_at).toLocaleString()+'</div><div class="body">'+(window.marked?DOMPurify.sanitize(marked.parse(data.body)):'<p>'+esc(data.body)+'</p>')+'</div><div class="source">Original source: <a href="'+esc(data.source_url)+'" target="_blank" rel="noopener noreferrer">'+esc(data.source_name)+'</a>. Read the source for the full report and context.</div>'})();
</script></body></html>
