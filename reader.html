<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ff"><meta name="robots" content="noindex,follow"><title>My Reading List — CreatorBoost</title><style>
:root{color-scheme:light;--bg:#fbf9ff;--line:#eadff5;--muted:#756b83;--purple:#8052d6;--pink:#d946a6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 78% -10%,#f4d9f1,transparent 42%),var(--bg);color:#282036;font:15px/1.6 system-ui,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 20px}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:850;color:#392449;text-decoration:none}.nav{display:flex;gap:16px}.nav a{color:#63556f;text-decoration:none}.hero{padding:42px 0 20px}.eyebrow{font-size:11px;letter-spacing:1.7px;color:var(--pink);font-weight:850}h1{font-size:clamp(34px,5vw,52px);line-height:1.1;margin:8px 0}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:18px 0}.tab,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:#624a70;font-weight:750;cursor:pointer}.tab.active,.btn.primary{background:linear-gradient(100deg,#8052d6,#e45eaa);color:#fff;border-color:transparent}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{padding:16px;background:linear-gradient(145deg,#fff,#fcf7ff);border:1px solid var(--line);border-radius:15px}.item h2{font-size:18px;margin:0 0 6px}.item a{text-decoration:none;color:#392449}.item small{color:#8d8199}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}.hidden{display:none!important}.field{display:grid;gap:6px;margin:10px 0}.field input{padding:11px;border:1px solid var(--line);border-radius:10px;background:white}@media(max-width:600px){.wrap{padding:0 14px}.grid{grid-template-columns:1fr}.nav{font-size:12px;gap:10px}}
</style></head><body><header class="wrap"><a class="brand" href="news.html">CreatorBoost / Reader</a><nav class="nav"><a href="news.html">Newsroom</a><a href="live.html">Live Hub</a><a href="membership.html">Membership</a></nav></header><main class="wrap"><section class="hero"><div class="eyebrow">YOUR PERSONAL NEWSROOM</div><h1>My reading list</h1><p class="muted">Saved articles and recently read stories on this device.</p></section><section id="auth"><form id="login"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary">Sign in to view saved articles</button></form><p id="authMessage" class="muted"></p></section><section id="content" class="hidden"><div class="tabs"><button class="tab active" data-tab="saved">Saved articles</button><button class="tab" data-tab="history">Reading history</button></div><div id="saved" class="grid"></div><div id="history" class="grid hidden"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://yubjmudsbbgskeqqejob.supabase.co","sb_publishable_Bb3ky6zyibP7LS2dXVZNnA_UYNWezlr");const $=id=>document.getElementById(id);const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function renderHistory(){let h=[];try{h=JSON.parse(localStorage.getItem("cb_reading_history")||"[]")}catch{}$("history").innerHTML=h.length?h.map(x=>'<article class="item"><h2><a href="article.html?slug='+encodeURIComponent(x.slug)+'">'+esc(x.title)+'</a></h2><small>Read '+new Date(x.read_at).toLocaleString()+'</small></article>').join(""):'<div class="empty">Your recently read articles will appear here.</div>'}
async function load(){const {data:session}=await db.auth.getSession();if(!session.session)return;$("auth").classList.add("hidden");$("content").classList.remove("hidden");const {data,error}=await db.from("cb_reader_bookmarks").select("article_id,created_at,cb_public_articles(id,title,slug,excerpt,category,status)").eq("user_id",session.session.user.id).order("created_at",{ascending:false});$("saved").innerHTML=error?'<div class="empty">Could not load bookmarks: '+esc(error.message)+'</div>':(data||[]).filter(x=>x.cb_public_articles?.status==="published").map(x=>'<article class="item"><small>'+esc(x.cb_public_articles.category)+'</small><h2><a href="article.html?slug='+encodeURIComponent(x.cb_public_articles.slug)+'">'+esc(x.cb_public_articles.title)+'</a></h2><p class="muted">'+esc(x.cb_public_articles.excerpt)+'</p><button class="btn" data-remove="'+x.article_id+'">Remove bookmark</button></article>').join("")||'<div class="empty">No saved articles yet. Use ☆ Save article on any story.</div>';renderHistory();$("saved").querySelectorAll("[data-remove]").forEach(b=>b.onclick=async()=>{await db.from("cb_reader_bookmarks").delete().eq("article_id",b.dataset.remove).eq("user_id",session.session.user.id);await load()})}
$("login").onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("authMessage").textContent=error?error.message:"Signed in.";if(!error)await load()};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));$("saved").classList.toggle("hidden",b.dataset.tab!=="saved");$("history").classList.toggle("hidden",b.dataset.tab!=="history")});load();
</script></body></html>
